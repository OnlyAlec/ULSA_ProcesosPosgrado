name: Code Style

on:
  push:
    branches-ignore:
      - 'main'
      - 'development'

jobs:
    php-cs-fixer:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Pull latest changes
              run: git pull --rebase origin ${{ github.head_ref }}

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.3"
                  coverage: none
                  tools: composer

            - name: Cache Composer dependencies
              uses: actions/cache@v3
              with:
                  path: ~/.composer/cache
                  key: php-cs-fixer-${{ hashFiles('.php-cs-fixer.dist.php') }}

            - name: Install PHP CS Fixer
              run: composer global require friendsofphp/php-cs-fixer --no-progress

            - name: Run PHP CS Fixer
              run: $HOME/.composer/vendor/bin/php-cs-fixer fix --allow-risky=yes --config=.php-cs-fixer.dist.php --verbose

            - name: Remove cache file
              run: |
                  rm -f .php-cs-fixer.cache

            - name: Commit changes
              uses: stefanzweifel/git-auto-commit-action@v5.0.0
              with:
                  commit_message: Fix PHP styling 🎨
                  branch: ${{ github.head_ref }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    prettier:
        runs-on: ubuntu-latest
        needs: php-cs-fixer

        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}

            - name: Pull latest changes
              run: git pull --rebase origin ${{ github.head_ref }}
                  
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'
                cache: 'npm'

            - name: Install npm dependencies
              run: npm ci

            - name: Run Prettier and Commit Changes
              uses: creyD/prettier_action@v4.3
              with:
                  commit_message: 'Fix Prettier styling 🎨'
                  prettier_options: '--write . --ignore-path .prettierignore --config .prettierrc --ignore-unknown'
